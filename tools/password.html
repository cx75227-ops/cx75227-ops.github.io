<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机密码生成器 - 工具箱</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="tool-header"><a class="back" href="../index.html">← 返回</a></div>
  <div class="tool-wrap">
    <h1>随机密码生成器</h1>
    <label>长度 <input id="len" type="number" value="16" min="4" max="64"></label><br><br>
    <label><input type="checkbox" id="up" checked> 大写字母</label>
    <label><input type="checkbox" id="low" checked> 小写字母</label>
    <label><input type="checkbox" id="num" checked> 数字</label>
    <label><input type="checkbox" id="sym" checked> 符号</label><br><br>
    <button onclick="gen()">生成</button>
    <button onclick="copyPwd()">复制</button>
    <div class="output" id="output"></div>
  </div>
  <script>
    const out = document.getElementById('output');
    const sets = {
      up: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
      low: 'abcdefghijklmnopqrstuvwxyz',
      num: '0123456789',
      sym: '!@#$%^&*()-_=+[]{}'
    };
    function gen(){
      let pool = '';
      for(const k in sets) if(document.getElementById(k).checked) pool += sets[k];
      if(!pool){ out.textContent = '请至少勾选一种字符'; return; }
      const n = parseInt(document.getElementById('len').value) || 16;
      const a = new Uint32Array(n);
      crypto.getRandomValues(a);
      let r = '';
      for(let i=0;i<n;i++) r += pool[a[i] % pool.length];
      out.textContent = r;
      out.style.color = '#9fe8a8';
    }
    function copyPwd(){ navigator.clipboard.writeText(out.textContent); }
    gen();
  </script>
</body>
</html>
