<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Base64 编解码 - 工具箱</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="tool-header"><a class="back" href="../index.html">← 返回</a></div>
  <div class="tool-wrap">
    <h1>Base64 编解码</h1>
    <textarea id="input" rows="6" placeholder="输入文本或 Base64"></textarea>
    <button onclick="encode()">编码</button>
    <button onclick="decode()">解码</button>
    <div class="output" id="output"></div>
  </div>
  <script>
    const input = document.getElementById('input');
    const out = document.getElementById('output');
    function ok(s){out.textContent=s;out.style.color='#9fe8a8';}
    function err(s){out.textContent=s;out.style.color='#ff7b7b';}
    function encode(){
      try { ok(btoa(unescape(encodeURIComponent(input.value)))); }
      catch(e){ err('编码失败：'+e.message); }
    }
    function decode(){
      try { ok(decodeURIComponent(escape(atob(input.value.trim())))); }
      catch(e){ err('解码失败：'+e.message); }
    }
  </script>
</body>
</html>
