<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>工具箱 - 在线工具集合</title>
  <meta name="description" content="免费在线工具集合：JSON 格式化、时间戳转换、Base64 编解码、URL 编解码、正则测试、颜色转换等。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>工具箱</h1>
    <p>免费在线小工具，随开随用</p>
  </header>
  <main>
    <section class="category">
      <h2>编码 / 转换</h2>
      <div class="grid">
        <a class="card" href="tools/json.html">
          <div class="name">JSON 格式化</div>
          <div class="desc">校验、格式化、压缩 JSON</div>
        </a>
        <a class="card" href="tools/timestamp.html">
          <div class="name">时间戳转换</div>
          <div class="desc">时间戳 ↔ 日期时间互转</div>
        </a>
        <a class="card" href="tools/base64.html">
          <div class="name">Base64 编解码</div>
          <div class="desc">文本与 Base64 互转</div>
        </a>
        <a class="card" href="tools/url.html">
          <div class="name">URL 编解码</div>
          <div class="desc">URL 编码 / 解码</div>
        </a>
      </div>
    </section>
    <section class="category">
      <h2>文本 / 开发</h2>
      <div class="grid">
        <a class="card" href="tools/regex.html">
          <div class="name">正则测试</div>
          <div class="desc">在线测试正则表达式</div>
        </a>
        <a class="card" href="tools/color.html">
          <div class="name">颜色转换</div>
          <div class="desc">HEX ↔ RGB 互转</div>
        </a>
      </div>
    </section>
  </main>

</html>
